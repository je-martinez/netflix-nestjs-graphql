version: '3.9'

services:
  roach1:
    image: cockroachdb/cockroach:latest-v23.1
    container_name: roach1
    hostname: roach1
    ports:
      - "26257:26257"
      - "8080:8080"
    command: start --insecure --join=roach1,roach2,roach3
    volumes:
      - roach1-data:/cockroach/cockroach-data

  roach2:
    image: cockroachdb/cockroach:latest-v23.1
    container_name: roach2
    hostname: roach2
    ports:
      - "26258:26257"
    command: start --insecure --join=roach1,roach2,roach3
    volumes:
      - roach2-data:/cockroach/cockroach-data

  roach3:
    image: cockroachdb/cockroach:latest-v23.1
    container_name: roach3
    hostname: roach3
    ports:
      - "26259:26257"
    command: start --insecure --join=roach1,roach2,roach3
    volumes:
      - roach3-data:/cockroach/cockroach-data

  roach-init:
    image: cockroachdb/cockroach:latest-v23.1
    container_name: roach-init
    hostname: roach-init
    volumes:
      - ./database/seed/netflixdb-postgres.sql:/seed/netflixdb.sql
    depends_on:
      - roach1
      - roach2
      - roach3
    entrypoint: 
      - "/bin/bash"
    command: >
      -c "
      echo 'Waiting for servers to be up...';
      sleep 10;
      /cockroach/cockroach init --insecure --host=roach1;
      echo 'Cluster initialized.';
      sleep 5;
      echo 'Creating database...';
      /cockroach/cockroach sql --insecure --host=roach1 --execute='CREATE DATABASE IF NOT EXISTS netflix;';
      echo 'Seeding database...';
      /cockroach/cockroach sql --insecure --host=roach1 --database=netflix --file=/seed/netflixdb.sql;
      echo 'Database seeded.';
      "

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ssm,secretsmanager
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    # Needed on Linux to reach the host (app) from inside the container.
    # On macOS/Windows host.docker.internal resolves automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Ensure the provisioned datasource uid matches the one used in dashboard JSON
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  roach1-data:
  roach2-data:
  roach3-data:
  redis-data:
  prometheus-data:
  grafana-data:
